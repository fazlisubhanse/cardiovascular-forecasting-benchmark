source_integrity:
  require_phase1_phase2a_head_match: true
selection:
  require_full_available_fold_coverage: true
calibration:
  history: all_feasible_before_outer_origin
  minimum_residual_count: 8
  nominal_levels: [0.80, 0.95]
  finite_sample: true
block_bootstrap_sensitivity:
  trigger_coverage_shortfall: 0.10
  trigger_coincident_fraction: 0.25
  repetitions: 5000
  seed: 20260810
metric_bootstrap:
  repetitions: 5000
  seed: 20260810
temporal_periods:
  - {name: 2000-2007, start: 2000, end: 2007}
  - {name: 2008-2015, start: 2008, end: 2015}
  - {name: 2016-2023, start: 2016, end: 2023}
runtime:
  estimator_n_jobs: 1
  independent_cell_workers: 3
  overwrite_phase2b1_outputs: true
