data:
  path: data/validated/heart_disease_series_validated.csv
  expected_sha256: 376ccd858ea6a759c08d4ee5fb8e68f1fd4b8b3e66334b586195014facf316cd
  targets: [asph, mtc]
  year_column: year
backtest:
  initial_train_end_year: 1999
  final_year: 2023
  horizons: [1, 2, 5]
  recent_window_start_year: 2016
  strategy: expanding
  refit_every_origin: true
representations:
  primary: [first_difference_direct, linear_detrend_direct]
  diagnostic: [raw_level_direct]
lookbacks: [3, 5, 6, 8]
inner_validation:
  recent_origins: 8
  minimum_training_years: 20
  minimum_supervised_samples: 12
  selection_metrics: [rmse, mae]
models:
  SVR:
    kernel: [rbf]
    C: [0.1, 1, 10, 100]
    epsilon: [0.01, 0.05, 0.1]
    gamma: [scale, 0.01, 0.1, 1]
  RandomForest:
    n_estimators: [200, 500]
    max_depth: [null, 3, 5]
    min_samples_leaf: [1, 2, 4]
    max_features: [1.0, sqrt]
    bootstrap: [true]
  XGBoost:
    n_estimators: [100, 300]
    max_depth: [2, 3]
    learning_rate: [0.03, 0.1]
    min_child_weight: [1, 3]
    reg_lambda: [1, 10]
    subsample: [1.0]
    colsample_bytree: [1.0]
    objective: [reg:squarederror]
    tree_method: [hist]
scaling:
  SVR: {features: true, target: true}
  RandomForest: {features: false, target: false}
  XGBoost: {features: false, target: false}
conformal:
  calibration_origins: 8
  minimum_residual_count: 8
  nominal_levels: [0.80, 0.95]
  finite_sample: true
statistics:
  alpha: 0.05
  dm_loss: squared_error
  multiple_testing_adjustment: holm
  bootstrap_repetitions: 5000
  bootstrap_seed: 20260810
runtime:
  random_seed: 20260810
  n_jobs: 1
  overwrite_phase2b_outputs: true
